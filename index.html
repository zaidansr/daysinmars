<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15151f">
  <title>Mars Radiation Tower</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game" aria-labelledby="game-title">
    <h1 id="game-title" class="sr-only">Mars Radiation Tower</h1>
    <p id="controls-help" class="sr-only">Move with the arrow keys or WASD. Press E to use a nearby station, or use the on-screen controls. Press Escape to close an open panel.</p>
    <div class="scene">
      <aside class="donki-display" aria-label="DONKI solar particle alert">
        <img src="assets/donki-panel.png" alt="DONKI. Solar particle alert. Training simulation." width="645" height="992" draggable="false">
        <img class="solar-monitor" src="assets/solar-monitor-pixel.png" alt="" width="160" height="90" draggable="false">
      </aside>
      <div id="alert" class="solar-alert" role="status" hidden></div>
      <section id="world" class="tower" aria-label="Radiation tower control room" aria-describedby="controls-help" tabindex="0">
        <img class="tower-art" src="assets/tower.png" alt="" width="941" height="992" draggable="false">
        <button type="button" class="station station-donki" data-station="donki" aria-label="DONKI solar activity console" title="DONKI"></button>
        <button type="button" class="station station-rad" data-station="rad" aria-label="RAD radiation console" title="RAD"></button>
        <button type="button" class="station station-crew" data-station="crew" aria-label="CREW status console" title="CREW"></button>
        <button type="button" class="station station-phone" data-station="phone" aria-label="PHONE emergency communications" title="PHONE"></button>
        <button type="button" class="station station-instructor" data-station="instructor" aria-label="Instructor" title="Instructor"></button>
        <button type="button" class="station station-lab" data-station="lab" aria-label="MAGNET trainer" title="MAGNET"></button>
        <button type="button" class="station station-desk" data-station="desk" aria-label="Shift desk" title="Shift desk"></button>
        <div id="player" class="player" aria-hidden="true">
          <img src="assets/astronaut.png" alt="" width="73" height="97" draggable="false">
        </div>
        <button type="button" id="prompt" class="prompt" data-action="interact" aria-label="Interact with nearby station"></button>
      </section>
    </div>

    <div id="toolbar" class="toolbar" aria-label="Game controls">
      <div class="touch-movement" role="group" aria-label="Movement controls">
        <button type="button" class="move-key move-up" data-move="up" aria-label="Move up">↑</button>
        <button type="button" class="move-key move-left" data-move="left" aria-label="Move left">←</button>
        <button type="button" class="move-key move-down" data-move="down" aria-label="Move down">↓</button>
        <button type="button" class="move-key move-right" data-move="right" aria-label="Move right">→</button>
        <button type="button" class="move-key touch-interact" data-action="interact">Interact</button>
      </div>
      <div class="mission-actions">
        <button type="button" class="primary" data-action="start">Start training</button>
        <button type="button" data-action="help">Help</button>
      </div>
      <p class="keyboard-hint"><kbd>WASD</kbd> / <kbd>↑ ↓ ← →</kbd> Move <span aria-hidden="true">·</span> <kbd>E</kbd> Interact</p>
      <div class="mission-status">
        <span id="clock"></span>
        <span id="status" role="status" aria-live="polite" aria-atomic="true"></span>
      </div>
    </div>
    <noscript>Enable JavaScript in your browser to play the training simulation.</noscript>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <header class="dialog-header">
      <h2 id="dialog-title"></h2>
      <button type="button" id="dialog-close" aria-label="Close panel">×</button>
    </header>
    <div id="dialog-content" class="dialog-content"></div>
  </dialog>
</body>
</html>
